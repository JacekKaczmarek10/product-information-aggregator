server:
  port: 8080

spring:
  application:
    name: product-aggregator
  threads:
    virtual:
      enabled: true

aggregator:
  timeout-ms: 300
  catalog-timeout-ms: 150
  pricing-timeout-ms: 180
  availability-timeout-ms: 200
  customer-timeout-ms: 160

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
